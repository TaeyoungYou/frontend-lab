<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exponential Smoothing</title>
    <script src="./script.js" defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 50px;
        padding: 100px;

        background-color: rgba(0, 0, 0, 0.9);
      }
      .ball {
        width: 80px;
        height: 80px;
        border: none;
        border-radius: 50%;
        background-color: #eee;

        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="ball first"></div>
    <div class="ball second"></div>
    <div class="ball thrid"></div>
  </body>
</html>
